<a href="#main-content" class="skip-link"> Skip to main content</a>

<nav class="site-navbar" aria-label="Main navigation">
    <div class="navbar-container">
        
        <a href="{% url 'home' %}" class="navbar-brand"> WCAG Scanner</a> <!-- Logo / Name -->

        <div class="navbar-links">
            <a href="{% url 'home' %}"
            {% if request.resolver_match.url_name == "home" %}
                aria-current="page"
            {% endif %}> Home </a>

            {% if user.is_authenticated %} <!-- check authentication-->
                <a href="{% url 'scan_history' %}"
                   {% if request.resolver_match.url_name == "scan_history" %}
                       aria-current="page"
                   {% endif %}> My Scan History </a> <!-- automaticly generates scan history -->

                <span class="navbar-user"> {{ user.username }} </span>

                <form method="post"
                      action="{% url 'logout' %}" class="navbar-logout"> <!-- secure logout -->
                    {% csrf_token %}
                    <button type="submit">
                        Logout
                    </button>
                </form>

            {% else %}
                <a href="{% url 'login' %}"
                   {% if request.resolver_match.url_name == "login" %}
                       aria-current="page"
                   {% endif %}> Login</a>

                <a href="{% url 'register' %}"
                   {% if request.resolver_match.url_name == "register" %}
                       aria-current="page"
                   {% endif %}> Register</a>
            {% endif %}
        </div>
    </div>
</nav>
